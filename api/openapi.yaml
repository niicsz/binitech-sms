openapi: 3.0.3
info:
  title: BiniTech SMS API
  version: 1.0.0
  description: API pública de envio de SMS da BiniTech. Toda resposta usa o envelope code, message e data.
servers:
  - url: https://api.sms.binitechpdv.com.br
security:
  - ApiKeyHeader: []
  - BearerKey: []
tags:
  - name: Account
  - name: Messages
  - name: Webhooks
  - name: Campaigns
  - name: Senders

paths:
  /v1/account/balance:
    get:
      tags: [Account]
      operationId: getBalance
      summary: Saldo disponível e reservado da conta
      responses:
        '200':
          description: Saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/message/send:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Envia um SMS
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Mensagem aceita, tarifada e publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/message/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Status, segmentos e custo de uma mensagem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: Mensagem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/message/sendBulk:
    post:
      tags: [Messages]
      operationId: sendBulk
      summary: Envia até 10.000 SMS num lote; destinos inválidos são listados sem barrar o resto
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBulkRequest'
      responses:
        '202':
          description: Lote aceito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/message/list:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Lista mensagens da conta, das mais novas para as mais antigas, com paginação por cursor
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MessageStatus'}}
        - {name: campaign_id, in: query, schema: {type: string, maxLength: 40}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Página de mensagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/campaign/create:
    post:
      tags: [Campaigns]
      operationId: createCampaign
      summary: Agenda uma campanha; o texto aceita variáveis por destinatário no formato chave entre chaves duplas
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
      responses:
        '201':
          description: Campanha agendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/campaign/{id}/summary:
    get:
      tags: [Campaigns]
      operationId: campaignSummary
      summary: Andamento e resultado da campanha
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, maxLength: 40}}
      responses:
        '200':
          description: Resumo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/alphaname/list:
    get:
      tags: [Senders]
      operationId: listAlphanames
      summary: Remetentes da conta e situação da aprovação
      responses:
        '200':
          description: Remetentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlphanameListEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/webhook:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: Lista os webhooks da conta
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Cria um webhook e devolve o segredo de assinatura uma única vez
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: Webhook criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreatedEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /v1/webhook/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 40
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Consulta um webhook
      responses:
        '200':
          description: Webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEnvelope'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Altera um webhook; enable=true reativa um webhook desativado por falhas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateRequest'
      responses:
        '200':
          description: Webhook alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEnvelope'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Remove um webhook
      responses:
        '204':
          description: Removido
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerKey:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64

  responses:
    Error:
      description: Erro no envelope padrão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 4000 inválido, 4010 chave, 4020 saldo, 4030 proibido, 4040 não encontrado, 4090 conflito, 4290 limite, 5000 interno
        message:
          type: string
        data:
          $ref: '#/components/schemas/ErrorData'

    ErrorData:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    Encoding:
      type: string
      enum: [GSM7, UCS2]

    MessageStatus:
      type: string
      enum: [accepted, routed, submitted, delivered, undelivered, expired, rejected, failed]

    SendMessageRequest:
      type: object
      required: [to, from, text]
      properties:
        to:
          type: string
          description: Destino em E.164
          example: '+5511987654321'
        from:
          type: string
          maxLength: 11
          description: Remetente aprovado na conta
        text:
          type: string
          minLength: 1
          maxLength: 1600
        normalize:
          type: boolean
          description: Troca aspas e travessões tipográficos por equivalentes GSM antes de segmentar
        validity_minutes:
          type: integer
          minimum: 1
          maximum: 4320
        webhook_ref:
          type: string
          maxLength: 64

    SendResult:
      type: object
      required: [message_id, status, segments, encoding, cost, currency]
      properties:
        message_id:
          type: string
        status:
          $ref: '#/components/schemas/MessageStatus'
        segments:
          type: integer
        encoding:
          $ref: '#/components/schemas/Encoding'
        cost:
          type: string
          example: '0.0800'
        currency:
          type: string
          example: BRL
        test:
          type: boolean

    SendMessageEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/SendResult'

    Message:
      type: object
      required: [message_id, to, from, status, segments, encoding, cost, currency, created_at, expires_at]
      properties:
        message_id:
          type: string
        to:
          type: string
        from:
          type: string
        status:
          $ref: '#/components/schemas/MessageStatus'
        segments:
          type: integer
        encoding:
          $ref: '#/components/schemas/Encoding'
        cost:
          type: string
        currency:
          type: string
        error_code:
          type: string
        webhook_ref:
          type: string
        test:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    MessageEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Message'

    Balance:
      type: object
      required: [available, reserved, spendable, currency]
      properties:
        available:
          type: string
        reserved:
          type: string
        spendable:
          type: string
        currency:
          type: string

    BalanceEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Balance'

    WebhookEvent:
      type: string
      enum: [message.submitted, message.delivered, message.failed]

    WebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          description: URL https que recebe os eventos
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        description:
          type: string
          maxLength: 200

    WebhookUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/WebhookRequest'
        - type: object
          properties:
            enable:
              type: boolean

    Webhook:
      type: object
      required: [id, url, events, enabled, failures, created_at, updated_at]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        description:
          type: string
        enabled:
          type: boolean
        failures:
          type: integer
        last_status:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookCreated:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Segredo para conferir o header X-BiniTech-Signature. Só aparece na criação.

    WebhookEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Webhook'

    WebhookCreatedEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/WebhookCreated'

    WebhookListEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'

    BulkItem:
      type: object
      required: [to]
      properties:
        to: {type: string}
        text: {type: string, maxLength: 1600, description: Texto próprio deste destino; sem ele vale o texto do lote}
        webhook_ref: {type: string, maxLength: 64}

    SendBulkRequest:
      type: object
      required: [from, messages]
      properties:
        from: {type: string, maxLength: 11}
        text: {type: string, maxLength: 1600}
        normalize: {type: boolean}
        validity_minutes: {type: integer, minimum: 1, maximum: 4320}
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/BulkItem'}

    BulkAccepted:
      type: object
      required: [index, message_id, segments, cost]
      properties:
        index: {type: integer}
        message_id: {type: string}
        segments: {type: integer}
        cost: {type: string}

    BulkRejected:
      type: object
      required: [index, message]
      properties:
        index: {type: integer}
        field: {type: string}
        message: {type: string}

    BulkResult:
      type: object
      required: [accepted, rejected, total_cost, currency, test]
      properties:
        accepted: {type: array, items: {$ref: '#/components/schemas/BulkAccepted'}}
        rejected: {type: array, items: {$ref: '#/components/schemas/BulkRejected'}}
        total_cost: {type: string}
        currency: {type: string}
        test: {type: boolean}

    BulkEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer}
        message: {type: string}
        data: {$ref: '#/components/schemas/BulkResult'}

    MessagePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        next_cursor: {type: string}

    MessagePageEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer}
        message: {type: string}
        data: {$ref: '#/components/schemas/MessagePage'}

    CampaignRecipient:
      type: object
      required: [to]
      properties:
        to: {type: string}
        vars:
          type: object
          additionalProperties: {type: string}

    CampaignRequest:
      type: object
      required: [name, from, text, scheduled_at, recipients]
      properties:
        name: {type: string, maxLength: 120}
        from: {type: string, maxLength: 11}
        text: {type: string, maxLength: 1600}
        normalize: {type: boolean}
        validity_minutes: {type: integer, minimum: 1, maximum: 4320}
        scheduled_at: {type: string, format: date-time}
        window_start: {type: string, description: Início do horário permitido em HH:MM no fuso time_zone}
        window_end: {type: string, description: Fim do horário permitido em HH:MM}
        time_zone: {type: string, description: Fuso IANA; padrão America/Sao_Paulo}
        recipients:
          type: array
          minItems: 1
          maxItems: 100000
          items: {$ref: '#/components/schemas/CampaignRecipient'}

    CampaignSummary:
      type: object
      required: [campaign_id, name, status, scheduled_at, total, pending, submitted, rejected, delivered, failed, in_flight, cost, currency, test]
      properties:
        campaign_id: {type: string}
        name: {type: string}
        status: {type: string, enum: [scheduled, running, paused, done, cancelled]}
        scheduled_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        total: {type: integer}
        pending: {type: integer}
        submitted: {type: integer}
        rejected: {type: integer}
        delivered: {type: integer}
        failed: {type: integer}
        in_flight: {type: integer}
        cost: {type: string}
        currency: {type: string}
        test: {type: boolean}

    CampaignEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer}
        message: {type: string}
        data: {$ref: '#/components/schemas/CampaignSummary'}

    Alphaname:
      type: object
      required: [sender, kind, countries, status]
      properties:
        sender: {type: string}
        kind: {type: string, enum: [alphanumeric, shortcode, longcode]}
        countries: {type: array, items: {type: string}}
        status: {type: string, enum: [pending, approved, rejected]}

    AlphanameListEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer}
        message: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/Alphaname'}}
